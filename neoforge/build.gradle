plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

version rootProject.version

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    includeClasses {
        canBeResolved true
    }
}

repositories {
    maven { url "https://maven.neoforged.net/releases" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-neoforge:${architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    includeClasses forgeRuntimeLibrary("dev.ultreon:json5-api:$json5_api_version", { exclude group: "com.google.code.gson"; exclude group: "com.google.guava" })
}

processResources {
    inputs.property "version", rootProject.version
    inputs.property "description", getModDescription()
    inputs.property "loaderVersion", neoforge_version.toString().split("\\.")[0]
    inputs.property "neoforgeVersion", neoforge_version
    inputs.property "minecraftVersion", architectury.minecraft

    filesMatching("META-INF/neoforge.mods.toml") {
        HashMap<String, ?> p = new HashMap<>()
        p.put("version", rootProject.version)
        p.put("description", getModDescription())
        p.put("loaderVersion", neoforge_version.toString().split("\\.")[0])
        p.put("neoforgeVersion", neoforge_version)
        p.put("minecraftVersion", architectury.minecraft)
        expand(p)
    }
}

classes.inputs.files configurations.includeClasses.collect { it.isFile() && (it.name.endsWith(".zip") || it.name.endsWith(".jar")) ? zipTree(it) : it }

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    //noinspection GrDeprecatedAPIUsage
    input.set shadowJar.archiveFile
    dependsOn shadowJar

    from configurations.includeClasses.files.collect { zipTree(it) }

    archiveClassifier = null
}

jar {
    from configurations.includeClasses.files.collect { zipTree(it) }

    archiveClassifier = "dev"
    manifest {
        attributes([
                "Specification-Title"     : "Ultreon Modding Lib",
                "Specification-Vendor"    : "Ultreon Team",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Ultreon Team",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"           : "ultreonlib-common.mixins.json"
        ])
    }
}

sourcesJar {
    def commonSources = project(":common").tasks.sourcesJar
    dependsOn(commonSources as Object)
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        //noinspection GroovyAssignabilityCheck
        mavenForge(MavenPublication) {
            artifactId = archives_base_name + "-" + project.name
            //noinspection GroovyAssignabilityCheck
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}

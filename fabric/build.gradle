plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

version rootProject.version

base {
    archivesName = rootProject.name + "-" + project.name
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases" }
    mavenCentral()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-fabric:${architectury_version}"

    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"
    modImplementation 'com.electronwill.night-config:core:3.6.5'
    modImplementation 'com.electronwill.night-config:toml:3.6.5'

    include implementation("dev.ultreon:ubo:${ultreon_data_version}")

    include implementation("dev.ultreon.corelibs:corelibs-collections-v0:$corelibs_version")
    include implementation("dev.ultreon.corelibs:corelibs-commons-v0:$corelibs_version")
    include implementation("dev.ultreon.corelibs:corelibs-crash-v0:$corelibs_version")
    include implementation("dev.ultreon.corelibs:corelibs-datetime-v0:$corelibs_version")
    include implementation("dev.ultreon.corelibs:corelibs-events-v1:$corelibs_version")
    include implementation("dev.ultreon.corelibs:corelibs-functions-v0:$corelibs_version")
    include implementation("dev.ultreon.corelibs:corelibs-registries-v0:$corelibs_version")
    include implementation("dev.ultreon.corelibs:corelibs-text-v0:$corelibs_version")
    include implementation("dev.ultreon.corelibs:corelibs-translations-v0:$corelibs_version")

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    modImplementation "com.terraformersmc:modmenu:7.2.2", {
        exclude module: "fabric-api"
    }
}

processResources {
    inputs.property "version", rootProject.version

    filesMatching("fabric.mod.json") {
        HashMap<String, ?> p = new HashMap<>()
        p.put("version", rootProject.version)
        p.put("description", rootProject.getModDescription())
        p.put("loaderVersion", rootProject.fabric_loader_version)
        p.put("minecraftVersion", rootProject.architectury.minecraft)
        expand(p)
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    classifier "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    //noinspection GrDeprecatedAPIUsage
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    classifier null
}

jar {
    classifier "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        //noinspection GroovyAssignabilityCheck
        mavenCommon(MavenPublication) {
            artifactId = rootProject.name + "-" + project.name
            //noinspection GroovyAssignabilityCheck
            from components.java
        }
    }
}